description: |-
  QuotaRequest allows users to request a quota limit increase for a namespace.
  Users submit a QuotaRequest with a justification; the QuotaRequest controller
  automatically approves requests that fall within the namespace's
  autoApproveThreshold. Requests that exceed the threshold remain Pending for
  operator review.

  QuotaRequest objects are immutable after creation. Approved requests cannot
  be deleted via the public API, preserving them as an immutable audit record.
properties:
  apiVersion:
    description: |-
      APIVersion defines the versioned schema of this representation of an object.
      Servers should convert recognized schemas to the latest internal value, and
      may reject unrecognized values.
      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
    type: string
  kind:
    description: |-
      Kind is a string value representing the REST resource this object represents.
      Servers may infer this from the endpoint the client submits requests to.
      Cannot be updated.
      In CamelCase.
      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
    type: string
  metadata:
    type: object
  spec:
    description: spec defines the requested quota increase.
    properties:
      neededBy:
        description: |-
          neededBy is the date by which the additional quota is required.
          Providing this information helps the platform pre-provision shared
          infrastructure before the new limit is reached.
          This field is immutable after creation.
        format: date-time
        type: string
        x-kubernetes-validations:
        - message: neededBy is immutable
          rule: self == oldSelf
      reason:
        description: |-
          reason describes why the limit increase is needed.
          This field is immutable after creation.
        maxLength: 1024
        minLength: 1
        type: string
        x-kubernetes-validations:
        - message: reason is immutable
          rule: self == oldSelf
      requestedLimit:
        description: |-
          requestedLimit is the new limit value being requested.
          Must be greater than the current effective limit.
          This field is immutable after creation.
        format: int32
        minimum: 1
        type: integer
        x-kubernetes-validations:
        - message: requestedLimit is immutable
          rule: self == oldSelf
      resource:
        description: |-
          resource is the plural lowercase resource name for which a limit increase
          is requested, e.g. "hostedclusters" or "nodepools".
          This field is immutable after creation.
        enum:
        - hostedclusters
        - nodepools
        type: string
        x-kubernetes-validations:
        - message: resource is immutable
          rule: self == oldSelf
    required:
    - reason
    - requestedLimit
    - resource
    type: object
  status:
    description: status reflects the current phase of the request.
    properties:
      approvedLimit:
        description: approvedLimit is the limit value that was granted. Set only when
          phase is Approved.
        format: int32
        minimum: 1
        type: integer
      autoApproved:
        description: |-
          autoApproved indicates whether this request was automatically approved by
          the controller (true) or by an operator (false). This field is internal
          and not exposed on the public API.
        type: boolean
      decidedAt:
        description: decidedAt is the time at which the request was approved or denied.
        format: date-time
        type: string
      decisionNote:
        description: decisionNote is a human-readable explanation of the approval
          or denial decision.
        maxLength: 1024
        type: string
      phase:
        description: phase is the current lifecycle phase of the request.
        enum:
        - Pending
        - Approved
        - Denied
        type: string
    type: object
required:
- spec
type: object
