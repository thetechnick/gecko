description: |-
  Quota is the authoritative per-namespace record of resource limits and live
  consumption for HostedCluster and NodePool objects. Each namespace has exactly
  one Quota object, named "default", created and maintained by the platform.
  Users have read-only access via the public API; operators manage limits and
  auto-approval thresholds via the private API.
properties:
  apiVersion:
    description: |-
      APIVersion defines the versioned schema of this representation of an object.
      Servers should convert recognized schemas to the latest internal value, and
      may reject unrecognized values.
      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
    type: string
  kind:
    description: |-
      Kind is a string value representing the REST resource this object represents.
      Servers may infer this from the endpoint the client submits requests to.
      Cannot be updated.
      In CamelCase.
      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
    type: string
  metadata:
    type: object
  spec:
    description: spec contains the configured resource limits for this namespace.
    properties:
      resources:
        description: resources contains the per-resource quota configurations.
        items:
          description: QuotaResourceSpec contains the quota configuration for a single
            resource kind.
          properties:
            autoApproveThreshold:
              description: |-
                autoApproveThreshold is the maximum requestedLimit that the QuotaRequest
                controller will approve automatically without operator intervention.
                This field is internal and not exposed on the public API.
              format: int32
              minimum: 0
              type: integer
            limit:
              description: |-
                limit is the effective enforced limit for this resource in the namespace.
                It reflects the base limit, adjusted by any approved QuotaRequest or
                operator-set manualLimit.
              format: int32
              minimum: 0
              type: integer
            manualLimit:
              description: |-
                manualLimit is an operator-set override. When set, it takes precedence over
                the base limit and any approved QuotaRequests. Visible via the private API only.
              format: int32
              minimum: 0
              type: integer
            resource:
              description: resource is the plural lowercase resource name, e.g. "hostedclusters"
                or "nodepools".
              enum:
              - hostedclusters
              - nodepools
              type: string
          required:
          - limit
          - resource
          type: object
        type: array
        x-kubernetes-list-map-keys:
        - resource
        x-kubernetes-list-type: map
    type: object
  status:
    description: status contains live consumption data observed by the platform.
    properties:
      conditions:
        description: |-
          conditions represents the latest observed state of the Quota object.
          The HighUsage condition is True when at least one resource has reached
          80% of its effective limit.
        items:
          description: Condition contains details for one aspect of the current state
            of this API Resource.
          properties:
            lastTransitionTime:
              description: |-
                lastTransitionTime is the last time the condition transitioned from one status to another.
                This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
              format: date-time
              type: string
            message:
              description: |-
                message is a human readable message indicating details about the transition.
                This may be an empty string.
              maxLength: 32768
              type: string
            observedGeneration:
              description: |-
                observedGeneration represents the .metadata.generation that the condition was set based upon.
                For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                with respect to the current state of the instance.
              format: int64
              minimum: 0
              type: integer
            reason:
              description: |-
                reason contains a programmatic identifier indicating the reason for the condition's last transition.
                Producers of specific condition types may define expected values and meanings for this field,
                and whether the values are considered a guaranteed API.
                The value should be a CamelCase string.
                This field may not be empty.
              maxLength: 1024
              minLength: 1
              pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
              type: string
            status:
              description: status of the condition, one of True, False, Unknown.
              enum:
              - "True"
              - "False"
              - Unknown
              type: string
            type:
              description: type of condition in CamelCase or in foo.example.com/CamelCase.
              maxLength: 316
              pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
              type: string
          required:
          - lastTransitionTime
          - message
          - reason
          - status
          - type
          type: object
        type: array
        x-kubernetes-list-map-keys:
        - type
        x-kubernetes-list-type: map
      resources:
        description: resources contains per-resource consumption data.
        items:
          description: QuotaResourceStatus contains live consumption data for a single
            resource kind.
          properties:
            current:
              description: current is the number of objects of this resource kind
                currently in the namespace.
              format: int32
              minimum: 0
              type: integer
            quotaReachedTime:
              description: |-
                quotaReachedTime is the time at which the limit was first reached for this
                resource. Null when the limit has not been reached.
              format: date-time
              type: string
            resource:
              description: resource is the plural lowercase resource name, e.g. "hostedclusters"
                or "nodepools".
              enum:
              - hostedclusters
              - nodepools
              type: string
          required:
          - current
          - resource
          type: object
        type: array
        x-kubernetes-list-map-keys:
        - resource
        x-kubernetes-list-type: map
    type: object
type: object
